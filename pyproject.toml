[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heightmap_interpolation"
version = "1.1.0"
authors = [
  { name="Ricard Campos", email="ricard.campos@coronis.es" },
]
description = "Interpolation functions for heightmaps developed within the EMODnet Bathymetry (High Resolution Seabed Mapping) project."
readme = "Readme.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: English"
]
dependencies = [
    'matplotlib>=3.5.0b1',
    'numpy>=1.20.3',
    'haversine>=2.5.1',
    'scipy>=1.7.1',
    'netCDF4>=1.5.7',
    'geopy>=2.2.0',
    'geopandas>=1.0',
    'opencv-python-headless>=4.5.3.56,<5',  # <5: exemplar_based_inpainting (ebi) breaks with OpenCV 5
    'numba>=0.54.1',
    'psutil>=5.8.0',
    'py_ams_point_interpolant>=0.1.1rc1'
]

[project.urls]
Homepage = "https://github.com/coronis-computing/heightmap_interpolation/"

[project.optional-dependencies]
docs = [        
    'sphinx',
    'sphinx-rtd-theme',
    'sphinx-autobuild'
]
gpu = [
    # GPU backend of the FD-PDE inpainters (--backend gpu). Taichi Forge is a maintained,
    # API-compatible fork of Taichi with wheels for Python 3.10-3.14. Do not install it
    # together with the original 'taichi' package in the same environment.
    'taichi-forge'
]
experimental = [
    'opencv-contrib-python-headless>=4.5.3.56,<5', # Shiftmap (<5: see opencv-python-headless above)
    'exemplar-based-inpainting', # EBI
    'opencv-python<5', # Pulled (unpinned) by exemplar-based-inpainting, which breaks with OpenCV 5
    'torch', # MLP
    'pygmt' # GMT surface gridder (also requires the GMT binaries on the system)
]
dev = [
    'ruff'
]

[tool.setuptools]
include-package-data=true

[tool.setuptools.packages.find]
where=["."]

[project.scripts]
interpolate_netcdf4 = "heightmap_interpolation.apps.interpolate_netcdf4:main"
interpolate_xyz = "heightmap_interpolation.apps.interpolate_xyz:main"

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E203", "E266"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"